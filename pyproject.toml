[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-asset-risk-engine"
version = "1.0.1"
description = "One-period portfolio risk forecasting and VaR model validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ygndev"}]
keywords = ["portfolio-risk", "value-at-risk", "expected-shortfall", "backtesting", "stress-testing"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.urls]
Homepage = "https://github.com/ygndev/multi-asset-risk-engine"
Repository = "https://github.com/ygndev/multi-asset-risk-engine"
Issues = "https://github.com/ygndev/multi-asset-risk-engine/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
market = ["yfinance>=1.0", "exchange-calendars>=4.8", "matplotlib>=3.8"]

[project.scripts]
risk-engine = "risk_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
