[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-asset-risk-engine"
version = "0.1.0"
description = "One-period portfolio risk forecasting and VaR model validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
risk-engine = "risk_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
